main: me.elian.ezauctions.RookieAuctions
name: RookieAuctions
version: ${project.version}
api-version: 1.20
authors: [RookieCuzz, Elian, Silverwolfg11]
description: A safe, inventory-GUI auction plugin
softdepend: [Vault, PlaceholderAPI, ViaVersion]
provides: [ezAuctions]
folia-supported: true

permissions:
  rookieauctions.*:
    default: op
    description: All RookieAuctions permissions (legacy aliases remain supported)
    children:
      ezauctions.*: true
  rookieauctions.admin:
    default: false
    children:
      ezauctions.admin: true
  rookieauctions.player:
    default: true
    children:
      ezauctions.player: true
  rookieauctions.auction:
    default: true
    children:
      ezauctions.auction: true
  rookieauctions.auction.start:
    default: true
    children:
      ezauctions.auction.start: true
  rookieauctions.auction.start.sealed:
    default: true
    children:
      ezauctions.auction.start.sealed: true
  rookieauctions.auction.end:
    default: false
    children:
      ezauctions.auction.end: true
  rookieauctions.auction.end.others:
    default: false
    children:
      ezauctions.auction.end.others: true
  rookieauctions.auction.cancel:
    default: false
    children:
      ezauctions.auction.cancel: true
  rookieauctions.auction.cancel.others:
    default: false
    children:
      ezauctions.auction.cancel.others: true
  rookieauctions.auction.info:
    default: false
    children:
      ezauctions.auction.info: true
  rookieauctions.auction.remove:
    default: false
    children:
      ezauctions.auction.remove: true
  rookieauctions.auction.spam:
    default: false
    children:
      ezauctions.auction.spam: true
  rookieauctions.auction.ignore:
    default: false
    children:
      ezauctions.auction.ignore: true
  rookieauctions.auction.ignore.player:
    default: false
    children:
      ezauctions.auction.ignore.player: true
  rookieauctions.auction.scoreboard:
    default: false
    children:
      ezauctions.auction.scoreboard: true
  rookieauctions.auction.queue:
    default: false
    children:
      ezauctions.auction.queue: true
  rookieauctions.auction.impound:
    default: false
    children:
      ezauctions.auction.impound: true
  rookieauctions.auction.enable:
    default: false
    children:
      ezauctions.auction.enable: true
  rookieauctions.auction.disable:
    default: false
    children:
      ezauctions.auction.disable: true
  rookieauctions.auction.reload:
    default: false
    children:
      ezauctions.auction.reload: true
  rookieauctions.auction.update:
    default: false
    children:
      ezauctions.auction.update: true
  rookieauctions.updatemessage:
    default: false
    children:
      ezauctions.updatemessage: true
  rookieauctions.taxexempt:
    default: false
    children:
      ezauctions.taxexempt: true
  rookieauctions.cooldownexempt:
    default: false
    children:
      ezauctions.cooldownexempt: true
  ezauctions.*:
    default: op
    description: All commands
    children:
      ezauctions.admin: true
      ezauctions.player: true
  ezauctions.admin:
    default: false
    children:
      ezauctions.auction.cancel.others: true
      ezauctions.auction.impound: true
      ezauctions.auction.enable: true
      ezauctions.auction.disable: true
      ezauctions.auction.reload: true
      ezauctions.updatemessage: true
      ezauctions.auction.end: true
      ezauctions.auction.update: true
  ezauctions.player:
    default: true
    children:
      ezauctions.auction: true
      ezauctions.auction.start: true
      ezauctions.auction.start.sealed: true
      ezauctions.auction.cancel: true
      ezauctions.auction.info: true
      ezauctions.auction.remove: true
      ezauctions.auction.spam: true
      ezauctions.auction.ignore: true
      ezauctions.auction.ignore.player: true
      ezauctions.auction.scoreboard: true
      ezauctions.auction.queue: true
  ezauctions.auction:
    default: true
  ezauctions.auction.start:
    default: true
  ezauctions.auction.start.sealed:
    default: true
  ezauctions.auction.end:
    default: false
  ezauctions.auction.end.others:
    default: false
  ezauctions.auction.cancel:
    default: false
  ezauctions.auction.cancel.others:
    default: false
  ezauctions.auction.info:
    default: false
  ezauctions.auction.remove:
    default: false
  ezauctions.auction.spam:
    default: false
  ezauctions.auction.ignore:
    default: false
  ezauctions.auction.ignore.player:
    default: false
  ezauctions.auction.scoreboard:
    default: false
  ezauctions.auction.queue:
    default: false
  ezauctions.auction.impound:
    default: false
  ezauctions.auction.enable:
    default: false
  ezauctions.auction.disable:
    default: false
  ezauctions.auction.reload:
    default: false
  ezauctions.auction.update:
    default: false
  ezauctions.updatemessage:
    default: false
  ezauctions.taxexempt:
    default: false
  ezauctions.cooldownexempt:
    default: false
